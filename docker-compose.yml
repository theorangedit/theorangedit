version: '3'

services:
  haproxy:
    build:
      context: docker/haproxy
      dockerfile: Dockerfile
    ports:
      # host's nginx is expected to terminate SSL and route all reddit requests here
      - 8080:8080
    restart: always

  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: reddit
      # WARNING: also hardcoded in reddit's 'cron' file
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reddit
      POSTGRES_INITDB_ARGS: '--encoding=utf8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8'
    ports:
      - 5432:5432
    volumes:
      # can alternatively be a named volume
      - ./volumes/postgres:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - ./volumes/redis:/data
    restart: always

  memcached:
    build:
      context: docker/memcached
      dockerfile: Dockerfile
    ports:
      - 11211:11211
    restart: always

  rabbitmq:
    build:
      context: docker/rabbitmq
      dockerfile: Dockerfile
    environment:
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_DEFAULT_USER: reddit
      RABBITMQ_DEFAULT_PASS: reddit
    ports:
      - 5672:5672
      - 15672:15672
    restart: always

  solr:
    build:
      context: .
      dockerfile: docker/solr/Dockerfile
    ports:
      - 8983:8983
    volumes:
      - ./volumes/solr:/var/solr
    restart: always

  reddit:
    build:
      context: .
      dockerfile: docker/reddit/Dockerfile
    ports:
      - 8001:8001
      - 9000:9000
      - 8082:8082
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      # starts empty so bind mount can replace container directory, can alternatively be a named volume
      - ./volumes/media:/srv/www/media
    restart: always
    depends_on:
      - postgres
      - redis
      - memcached
      - rabbitmq
      - solr
